services:
  # ===== MySQL (แทน XAMPP) =====
  db:
    image: mysql:8.0
    container_name: coos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: coosdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Backend (Node.js + Express) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coos-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ===== Frontend (Nuxt 3) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coos-frontend
    restart: unless-stopped
    environment:
      # Internal URL สำหรับ SSR ใน container เพื่อเชื่อมต่อกับ backend โดยตรง
      NUXT_INTERNAL_API_BASE: http://backend:3000/api/v1
      # Public URL สำหรับ Browser (เปลี่ยน localhost เป็น IP หรือ Domain หากรันบนเครื่องอื่น)
      NUXT_PUBLIC_API_BASE: http://localhost:3000/api/v1
      # บังคับใช้ Polling สำหรับ Hot Reload ใน Docker บน Windows
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8888:8888"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
